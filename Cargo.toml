[package]
name = "evm-init"
version = "0.1.0"
edition = "2021"

default-run = "evm-init"

[[bin]]
name = "convert-rlp"
path = "src/bin/convert_rlp.rs"

[dependencies]
anyhow = "1.0.97"
clap = { version = "4.5.31", features = ["derive"] }
revm = { version = "29.0.1", default-features = false }
rmp = "0.8.14"
rmp-serde = "1.3.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
reth-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.2", default-features = false }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.2", features = ["serde-bincode-compat"] }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.2", features = ["serde-bincode-compat"] }
reth-rpc-convert = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.2", default-features = false }
reth-db-api = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.2", default-features = false }
reth-codecs = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.2", default-features = false }
derive_more = { version = "2", default-features = false, features = ["full"] }
rocksdb = "=0.21.0"
alloy-genesis = { version = "1.0.37", default-features = false }
alloy-consensus = { version = "1.0.37", default-features = false }
alloy-chains = { version = "0.2.5", default-features = false }
alloy-eips = { version = "1.0.37", default-features = false }
alloy-evm = { version = "0.21.0", default-features = false }
alloy-json-abi = { version = "1.3.1", default-features = false }
alloy-json-rpc = { version = "1.0.37", default-features = false }
alloy-dyn-abi = "1.3.1"
alloy-network = { version = "1.0.37", default-features = false }
alloy-primitives = { version = "1.3.1", default-features = false, features = ["map-foldhash"] }
alloy-rlp = { version = "0.3.10", default-features = false, features = ["core-net"] }
alloy-rpc-types = { version = "1.0.37", features = ["eth"], default-features = false }
alloy-rpc-types-eth = { version = "1.0.37", default-features = false }
alloy-rpc-types-engine = { version = "1.0.37", default-features = false }
alloy-signer = { version = "1.0.37", default-features = false }
alloy-sol-macro = "1.3.1"
alloy-sol-types = { version = "1.3.1", default-features = false }
aws-sdk-s3 = "1.93.0"
aws-config = "1.8.0"
tokio = { version = "1.44", features = ["full"] }
lz4_flex = "0.11"
